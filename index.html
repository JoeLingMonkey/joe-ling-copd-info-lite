<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOE LING COPD INFO LITE V1.00</title><style>body{background:#161923;color:#f7e5bf;font:18px Georgia,serif;text-align:center;padding:12vh 20px}progress{width:min(400px,90vw);height:20px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#161923}button{padding:12px}</style></head><body><h2>JOE LING COPD INFO LITE V1.00</h2><p id="status">Loading the interactive book…</p><progress id="progress" value="0" max="14"></progress><script>
(async()=>{const chunks=[];try{for(let i=1;i<=14;i++){const name=`book-part-${String(i).padStart(2,'0')}.bin`;const r=await fetch(name);if(!r.ok)throw Error(`${name}: HTTP ${r.status}`);chunks.push(await r.blob());document.getElementById('progress').value=i;document.getElementById('status').textContent=`Loading book: ${i} of 14 parts`; }const url=URL.createObjectURL(new Blob(chunks,{type:'text/html;charset=utf-8'}));const frame=document.createElement('iframe');frame.title='COPD Interactive Book';frame.src=url;document.body.appendChild(frame);}catch(e){document.getElementById('status').textContent='Unable to load the book: '+e.message;}})();
</script></body></html>
